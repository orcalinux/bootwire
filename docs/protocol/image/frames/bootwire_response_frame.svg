<text x="235.4" y="532.6" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">Bit 7 of byte 1 tells a response from a request, so a frame echoed back by a loop-back cable</text>
