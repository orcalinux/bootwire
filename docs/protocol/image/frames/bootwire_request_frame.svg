<text x="133.0" y="182.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" text-anchor="middle" fill="#173E6B" xml:space="preserve">1 byte</text>
<text x="133.0" y="226.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" text-anchor="middle" fill="#1F2D3D" xml:space="preserve">sequence number</text>
<text x="133.0" y="244.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" text-anchor="middle" fill="#5B6B7C" xml:space="preserve">+1 for every new request</text>
<text x="133.0" y="262.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" text-anchor="middle" fill="#5B6B7C" xml:space="preserve">same value on a resend</text>
<text x="301.0" y="116.0" font-family="'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" text-anchor="middle" fill="#8A99A8" xml:space="preserve">byte 1</text>
<rect x="221.0" y="128.0" width="160.0" height="72.0" rx="10" fill="#E9E2F9" stroke="#6B4FBB" stroke-width="1.6"/>
<text x="301.0" y="160.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#3B2A73" xml:space="preserve">CMD</text>
<text x="301.0" y="182.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" text-anchor="middle" fill="#3B2A73" xml:space="preserve">1 byte</text>
<text x="301.0" y="226.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" text-anchor="middle" fill="#1F2D3D" xml:space="preserve">command ID 0x00 … 0x7F</text>
<text x="301.0" y="244.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" text-anchor="middle" fill="#5B6B7C" xml:space="preserve">bit 7 = 0 marks a request</text>
<text x="554.0" y="116.0" font-family="'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" text-anchor="middle" fill="#8A99A8" xml:space="preserve">bytes 2 … N+1</text>
