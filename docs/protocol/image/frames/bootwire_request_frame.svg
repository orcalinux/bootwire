<svg xmlns="http://www.w3.org/2000/svg" width="980" height="557.25" viewBox="0 0 980 557.25" role="img"><rect id="bootwire-background" x="0" y="0" width="980" height="557.25" fill="#FFFFFF"/>
<title>Request Frame</title>
<defs></defs>
<rect width="980" height="557.25" fill="#FFFFFF"/>
<text x="490.0" y="42.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1B3A5F" xml:space="preserve">Request Frame</text>
<text x="490.0" y="66.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" text-anchor="middle" fill="#5B6B7C" xml:space="preserve">Host → target  ·  the bytes before SLIP encoding  ·  multi-byte fields are little-endian</text>
<text x="133.0" y="116.0" font-family="'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" text-anchor="middle" fill="#8A99A8" xml:space="preserve">byte 0</text>
