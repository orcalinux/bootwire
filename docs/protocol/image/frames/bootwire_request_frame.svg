<text x="166.8" y="494.6" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">The SLIP END byte marks the end of the frame and the CRC-16 proves it arrived complete.</text>
<text x="73.0" y="513.4" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#5B6B7C" xml:space="preserve">Shortest request: 4 bytes. Longest: max_payload + 4 bytes; a longer frame is dropped while it is received.</text>
