'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="137" x="217" y="360.6792">PING [SEQ=0x2A, "hi"]</text><text xml:space="preserve" fill="#1E90D6" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="57" x="362" y="360.6792">«resend»</text><line style="stroke: #3D5166; stroke-width: 1.3;" x1="472" x2="514" y1="409.3315" y2="409.3315"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="514" x2="514" y1="409.3315" y2="422.3315"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="473" x2="514" y1="422.3315" y2="422.3315"/><polygon fill="#3D5166" points="483,418.3315,473,422.3315,483,426.3315,479,422.3315" style="stroke: #3D5166; stroke-width: 1.0;"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="479" y="397.1023">06</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="89" x="497" y="389.6279">CRC-16 correct</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="212" x="497" y="404.5767">(0x2A, PING) not cached → execute</text><polygon fill="#3D5166" points="203,447.2803,193,451.2803,203,455.2803,199,451.2803" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3; stroke-dasharray: 2.0,2.0;" x1="197" x2="466" y1="451.2803" y2="451.2803"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="209" y="446.5254">07</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="110" x="227" y="446.5254">[SEQ=0x2A, 0x81,</text><text xml:space="preserve" fill="#1E8449" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="19" x="341" y="446.5254">OK</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="32" x="360" y="446.5254">, "hi"]</text><polygon fill="#3D5166" points="74.5,476.229,64.5,480.229,74.5,484.229,70.5,480.229" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3; stroke-dasharray: 2.0,2.0;" x1="68.5" x2="191" y1="480.229" y2="480.229"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="80.5" y="475.4741">08</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="27" x="98.5" y="475.4741">b"hi"</text><!--MD5=[55748ba01865657499e618976b2ab391]
@startuml bootwire_request_lost_sequence
skinparam shadowing false
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam defaultFontColor #1F2D3D
skinparam roundCorner 10
skinparam titleBorderThickness 0
skinparam ArrowColor #3D5166
skinparam ArrowFontColor #1F2D3D
skinparam ArrowFontSize 13
skinparam ArrowThickness 1.3

skinparam sequence {
  ParticipantBackgroundColor #1B3A5F
  ParticipantBorderColor #1B3A5F
  ParticipantFontColor #FFFFFF
  ParticipantFontStyle plain
  ParticipantFontSize 13
  ParticipantPadding 8
  LifeLineBorderColor #9DB3CC
  LifeLineBackgroundColor #DCEBFB
  BoxPadding 14
  BoxBorderColor #DFE6EE
  BoxFontColor #1B3A5F
  BoxFontStyle bold
  BoxFontSize 14
  GroupBorderColor #9DB3CC
  GroupBackgroundColor #E4ECF5
  GroupHeaderFontColor #1B3A5F
  GroupHeaderFontStyle bold
  GroupFontColor #5B6B7C
  DividerBackgroundColor #EEF3F9
  DividerBorderColor #C9D4E0
  DividerFontColor #1B3A5F
  DividerFontStyle bold
  ReferenceBackgroundColor #F4F7FB
  ReferenceBorderColor #9DB3CC
  ReferenceHeaderBackgroundColor #E4ECF5
  ReferenceFontColor #5B6B7C
  MessageAlign left
}

skinparam note {
  BackgroundColor #FFF8E6
  BorderColor #E8C66A
  FontColor #1F2D3D
  FontSize 12
}

skinparam activity {
  BackgroundColor #F4F7FB
  BorderColor #1B3A5F
  FontColor #1F2D3D
  FontSize 13
  DiamondBackgroundColor #FFFFFF
  DiamondBorderColor #1B3A5F
  DiamondFontColor #1F2D3D
  DiamondFontSize 12
  StartColor #1B3A5F
  EndColor #1B3A5F
  BarColor #1B3A5F
}

hide footbox
title <size:21><color:#1B3A5F><b>Fault: Request Lost</b></color></size>\n<size:13><color:#5B6B7C>no reply before the timeout: the host resends the same frame with the same SEQ</color></size>
box "Host (PC)" #F4F7FB
  participant "<b>bootwire CLI</b>\n<size:11><color:#C9D7E6>host application</color></size>" as APP #1B3A5F
  participant "<b>BootWireClient</b>\n<size:11><color:#C9D7E6>command layer</color></size>" as HOST #1B3A5F
end box
box "Target (Cortex-M bootloader)" #EEF6F4
  participant "<b>Target protocol</b>\n<size:11><color:#CBE6DF>frame check, reply cache</color></size>" as TP #146C5F
  participant "<b>Bootloader core</b>\n<size:11><color:#CBE6DF>flash driver</color></size>" as BL #146C5F
end box

autonumber "<b>00"
APP -> HOST : ping(b"hi")
HOST -> HOST : SEQ = 0x2A, start timer
HOST -[#C0392B]>x TP : PING [SEQ=0x2A, "hi"]  <color:#C0392B>lost on the wire</color>
... timeout (0.5 s), nothing received ...
HOST -> HOST : resend 2/4\n(same frame, same SEQ)
HOST -> TP : PING [SEQ=0x2A, "hi"]  <color:#1E90D6><b>«resend»</b></color>
activate TP
TP -> TP : CRC-16 correct\n(0x2A, PING) not cached → execute
TP - -> HOST : [SEQ=0x2A, 0x81, <color:#1E8449><b>OK</b></color>, "hi"]
deactivate TP
HOST - -> APP : b"hi"
@enduml

