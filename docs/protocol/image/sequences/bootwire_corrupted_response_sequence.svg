.5,452.2803" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="219.5" x2="553.5" y1="452.2803" y2="452.2803"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="226.5" y="447.5254">08</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="144" x="244.5" y="447.5254">VERIFY [SEQ=0x52, …]</text><text xml:space="preserve" fill="#1E90D6" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="57" x="396.5" y="447.5254">«resend»</text><line style="stroke: #3D5166; stroke-width: 1.3;" x1="569.5" x2="611.5" y1="481.229" y2="481.229"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="611.5" x2="611.5" y1="481.229" y2="494.229"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="570.5" x2="611.5" y1="494.229" y2="494.229"/><polygon fill="#3D5166" points="580.5,490.229,570.5,494.229,580.5,498.229,576.5,494.229" style="stroke: #3D5166; stroke-width: 1.0;"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="576.5" y="476.4741">09</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="174" x="594.5" y="476.4741">(0x52, VERIFY) = cached key</text><polygon fill="#3D5166" points="230.5,519.1777,220.5,523.1777,230.5,527.1777,226.5,523.1777" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3; stroke-dasharray: 2.0,2.0;" x1="224.5" x2="563.5" y1="523.1777" y2="523.1777"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="236.5" y="518.4229">10</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="108" x="254.5" y="518.4229">[SEQ=0x52, 0x92,</text><text xml:space="preserve" fill="#1E8449" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="19" x="366.5" y="518.4229">OK</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="39" x="385.5" y="518.4229">, CRC]</text><text xml:space="preserve" fill="#1E90D6" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="85" x="432.5" y="518.4229">«from cache»</text><polygon fill="#3D5166" points="74.5,548.1265,64.5,552.1265,74.5,556.1265,70.5,552.1265" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3; stroke-dasharray: 2.0,2.0;" x1="68.5" x2="218.5" y1="552.1265" y2="552.1265"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="80.5" y="547.3716">11</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="77" x="98.5" y="547.3716">0x5DD6F17A</text><!--MD5=[0d47ff152dd30f8a363b6974b94a4944]
@startuml bootwire_corrupted_response_sequence
skinparam shadowing false
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam defaultFontColor #1F2D3D
skinparam roundCorner 10
skinparam titleBorderThickness 0
skinparam ArrowColor #3D5166
skinparam ArrowFontColor #1F2D3D
skinparam ArrowFontSize 13
skinparam ArrowThickness 1.3

skinparam sequence {
  ParticipantBackgroundColor #1B3A5F
  ParticipantBorderColor #1B3A5F
  ParticipantFontColor #FFFFFF
  ParticipantFontStyle plain
  ParticipantFontSize 13
  ParticipantPadding 8
  LifeLineBorderColor #9DB3CC
  LifeLineBackgroundColor #DCEBFB
  BoxPadding 14
  BoxBorderColor #DFE6EE
  BoxFontColor #1B3A5F
  BoxFontStyle bold
  BoxFontSize 14
  GroupBorderColor #9DB3CC
  GroupBackgroundColor #E4ECF5
  GroupHeaderFontColor #1B3A5F
  GroupHeaderFontStyle bold
  GroupFontColor #5B6B7C
  DividerBackgroundColor #EEF3F9
  DividerBorderColor #C9D4E0
  DividerFontColor #1B3A5F
  DividerFontStyle bold
  ReferenceBackgroundColor #F4F7FB
  ReferenceBorderColor #9DB3CC
  ReferenceHeaderBackgroundColor #E4ECF5
  ReferenceFontColor #5B6B7C
  MessageAlign left
}

skinparam note {
  BackgroundColor #FFF8E6
  BorderColor #E8C66A
  FontColor #1F2D3D
  FontSize 12
}

skinparam activity {
  BackgroundColor #F4F7FB
  BorderColor #1B3A5F
  FontColor #1F2D3D
  FontSize 13
  DiamondBackgroundColor #FFFFFF
  DiamondBorderColor #1B3A5F
  DiamondFontColor #1F2D3D
  DiamondFontSize 12
  StartColor #1B3A5F
  EndColor #1B3A5F
  BarColor #1B3A5F
}

hide footbox
title <size:21><color:#1B3A5F><b>Fault: Response Damaged</b></color></size>\n<size:13><color:#5B6B7C>the host ignores a reply with a bad CRC-16, resends, and gets the cached reply</color></size>
box "Host (PC)" #F4F7FB
  participant "<b>bootwire CLI</b>\n<size:11><color:#C9D7E6>host application</color></size>" as APP #1B3A5F
  participant "<b>BootWireClient</b>\n<size:11><color:#C9D7E6>command layer</color></size>" as HOST #1B3A5F
end box
box "Target (Cortex-M bootloader)" #EEF6F4
  participant "<b>Target protocol</b>\n<size:11><color:#CBE6DF>frame check, reply cache</color></size>" as TP #146C5F
  participant "<b>Bootloader core</b>\n<size:11><color:#CBE6DF>flash driver</color></size>" as BL #146C5F
end box

autonumber "<b>00"
APP -> HOST : verify_image(image)
HOST -> TP : VERIFY [SEQ=0x52, address, length, CRC-32]
activate TP
TP -> BL : CRC-32 of flash
BL - -> TP : 0x5DD6F17A (matches)
TP -> TP : cache key = (0x52, VERIFY)
TP - -> HOST : [SEQ=0x52, 0x92, OK, CRC]  <color:#C0392B>damaged on the wire</color>
deactivate TP
HOST -> HOST : CRC-16 mismatch → ignore\nkeep waiting until the deadline
... timeout (0.5 s) ...
HOST -> TP : VERIFY [SEQ=0x52, …]  <color:#1E90D6><b>«resend»</b></color>
activate TP
TP -> TP : (0x52, VERIFY) = cached key
TP - -> HOST : [SEQ=0x52, 0x92, <color:#1E8449><b>OK</b></color>, CRC]  <color:#1E90D6><b>«from cache»</b></color>
deactivate TP
HOST - -> APP : 0x5DD6F17A
@enduml

