<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="616px" preserveAspectRatio="none" style="width:966px;height:616px;" version="1.1" viewBox="0 0 966 616" width="966px" zoomAndPan="magnify"><rect id="bootwire-background" x="0" y="0" width="966" height="616" fill="#FFFFFF"/><defs/><g><rect fill="none" height="49.0967" rx="5" ry="5" style="stroke: none; stroke-width: 1.0;" width="525" x="218" y="12"/><text xml:space="preserve" fill="#1B3A5F" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="21" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="216" x="372.5" y="36.6978">Fault: Response Lost</text><text xml:space="preserve" fill="#5B6B7C" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="509" x="226" y="53.3418">the target answers the resend from its reply cache and does not run the command again</text><rect fill="#F4F7FB" height="526.4263" rx="5" ry="5" style="stroke: #DFE6EE; stroke-width: 1.0;" width="338.5" x="4" y="72.0967"/><text xml:space="preserve" fill="#1B3A5F" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="65" x="140.75" y="85.2285">Host (PC)</text><rect fill="#EEF6F4" height="526.4263" rx="5" ry="5" style="stroke: #DFE6EE; stroke-width: 1.0;" width="360.5" x="530" y="72.0967"/><text xml:space="preserve" fill="#1B3A5F" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="204" x="608.25" y="85.2285">Target (Cortex-M bootloader)</text><rect fill="#DCEBFB" height="143.7437" style="stroke: #9DB3CC; stroke-width: 1.0;" width="10" x="605.5" y="194.6904"/><rect fill="#DCEBFB" height="85.8462" s