4" x="70.5" y="160.9868">01</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="32" x="88.5" y="160.9868">ping()</text><line style="stroke: #3D5166; stroke-width: 1.3;" x1="428.5" x2="470.5" y1="194.6904" y2="194.6904"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="470.5" x2="470.5" y1="194.6904" y2="207.6904"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="429.5" x2="470.5" y1="207.6904" y2="207.6904"/><polygon fill="#3D5166" points="439.5,203.6904,429.5,207.6904,439.5,211.6904,435.5,207.6904" style="stroke: #3D5166; stroke-width: 1.0;"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="435.5" y="189.9355">02</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="72" x="453.5" y="189.9355">SEQ = 0x70</text><path d="M360.5,222.6904 L428.5,222.6904 L428.5,228.6904 L418.5,238.6904 L355.5,238.6904 L355.5,227.6904 " fill="#E4ECF5" style="stroke: #9DB3CC; stroke-width: 1.0;"/><rect fill="none" height="88.8462" rx="5" ry="5" style="stroke: #9DB3CC; stroke-width: 2.0;" width="375.5" x="355.5" y="222.6904"/><text xml:space="preserve" fill="#1B3A5F" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="28" x="370.5" y="235.8843">loop</text><text xml:space="preserve" fill="#5B6B7C" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="232" x="443.5" y="236.8843">[attempt 1 … 4  (1 + max_retries = 3)]</text><line style="stroke: #C0392B; stroke-width: 2.0;" x1="626.5" x2="636.5" y1="255.5879" y2="