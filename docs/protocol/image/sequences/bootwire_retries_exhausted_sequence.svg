" y1="383.3828" y2="396.3828"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="64.5" x2="105.5" y1="396.3828" y2="396.3828"/><polygon fill="#3D5166" points="74.5,392.3828,64.5,396.3828,74.5,400.3828,70.5,396.3828" style="stroke: #3D5166; stroke-width: 1.0;"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="70.5" y="371.1536">05</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="301" x="88.5" y="363.6792">"Is the board in bootloader mode and the port right?"</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="64" x="88.5" y="378.6279">exit code 1</text><path d="M366,414.3828 L366,455.3828 A5,5 0 0 0 371,460.3828 L853,460.3828 A5,5 0 0 0 858,455.3828 L858,419.3828 L848,409.3828 L371,409.3828 A5,5 0 0 0 366,414.3828 " fill="#FFF8E6" style="stroke: #E8C66A; stroke-width: 1.0;"/><path d="M848,409.3828 L848,416.8828 A2.5,2.5 0 0 0 850.5,419.3828 L858,419.3828 L848,409.3828 " fill="#FFF8E6" style="stroke: #E8C66A; stroke-width: 1.0;"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="359" x="421.25" y="425.6387">Typical causes: wrong port or baud rate, the application is running</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="306" x="421.25" y="439.4375">instead of the bootloader, cable unplugged, target stuck.</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="373" x="421.25" y="453.2363">Worst-case wait = (1 + max_retries) × timeout = 2 s with the defaults.</text><!--MD5=[c800f1d34bdb6f8210e71ae0f3e22f46]
@startuml bootwire_retries_exhausted_sequence
skinparam shadowing false
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam defaultFontColor #1F2D3D
skinparam roundCorner 10
skinparam titleBorderThickness 0
skinparam ArrowColor #3D5166
skinparam ArrowFontColor #1F2D3D
skinparam ArrowFontSize 13
skinparam ArrowThickness 1.3

skinparam sequence {
  ParticipantBackgroundColor #1B3A5F
  ParticipantBorderColor #1B3A5F
  ParticipantFontColor #FFFFFF
  ParticipantFontStyle plain
  ParticipantFontSize 13
  ParticipantPadding 8
  LifeLineBorderColor #9DB3CC
  LifeLineBackgroundColor #DCEBFB
  BoxPadding 14
  BoxBorderColor #DFE6EE
  BoxFontColor #1B3A5F
  BoxFontStyle bold
  BoxFontSize 14
  GroupBorderColor #9DB3CC
  GroupBackgroundColor #E4ECF5
  GroupHeaderFontColor #1B3A5F
  GroupHeaderFontStyle bold
  GroupFontColor #5B6B7C
  DividerBackgroundColor #EEF3F9
  DividerBorderColor #C9D4E0
  DividerFontColor #1B3A5F
  DividerFontStyle bold
  ReferenceBackgroundColor #F4F7FB
  ReferenceBorderColor #9DB3CC
  ReferenceHeaderBackgroundColor #E4ECF5
  ReferenceFontColor #5B6B7C
  MessageAlign left
}

skinparam note {
  BackgroundColor #FFF8E6
  BorderColor #E8C66A
  FontColor #1F2D3D
  FontSize 12
}

skinparam activity {
  BackgroundColor #F4F7FB
  BorderColor #1B3A5F
  FontColor #1F2D3D
  FontSize 13
  DiamondBackgroundColor #FFFFFF
  DiamondBorderColor #1B3A5F
  DiamondFontColor #1F2D3D
  DiamondFontSize 12
  StartColor #1B3A5F
  EndColor #1B3A5F
  BarColor #1B3A5F
}

hide footbox
title <size:21><color:#1B3A5F><b>Fault: No Answer After All Retries</b></color></size>\n<size:13><color:#5B6B7C>1 + max_retries attempts with the same SEQ, then BootWireTimeout</color></size>
box "Host (PC)" #F4F7FB
  participant "<b>bootwire CLI</b>\n<size:11><color:#C9D7E6>host application</color></size>" as APP #1B3A5F
  participant "<b>BootWireClient</b>\n<size:11><color:#C9D7E6>command layer</color></size>" as HOST #1B3A5F
end box
box "Target (Cortex-M bootloader)" #EEF6F4
  participant "<b>Target protocol</b>\n<size:11><color:#CBE6DF>frame check, reply cache</color></size>" as TP #146C5F
  participant "<b>Bootloader core</b>\n<size:11><color:#CBE6DF>flash driver</color></size>" as BL #146C5F
end box

autonumber "<b>00"
APP -> HOST : ping()
HOST -> HOST : SEQ = 0x70
loop attempt 1 … 4  (1 + max_retries = 3)
  HOST -[#C0392B]>x TP : PING [SEQ=0x70]  <color:#C0392B>no answer</color>
  ... timeout (0.5 s) ...
end
HOST - -> APP : BootWireTimeout("PING: no response after 4 attempts")
APP -> APP : "Is the board in bootloader mode and the port right?"\nexit code 1
note over HOST, BL
  Typical causes: wrong port or baud rate, the application is running
  instead of the bootloader, cable unplugged, target stuck.
  Worst-case wait = (1 + max_retries) × timeout = 2 s with the defaults.
end note
@enduml

