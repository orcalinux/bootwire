e: #9DB3CC; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="12" x2="431.5" y1="514.1265" y2="514.1265"/><text xml:space="preserve" fill="#5B6B7C" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="92" x="17" y="526.3203">[same version]</text><polygon fill="#3D5166" points="90.5,561.9727,80.5,565.9727,90.5,569.9727,86.5,565.9727" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3; stroke-dasharray: 2.0,2.0;" x1="84.5" x2="357.5" y1="565.9727" y2="565.9727"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="96.5" y="553.7434">10</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="205" x="114.5" y="546.269">DeviceInfo: app region, erase block,</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="169" x="114.5" y="561.2178">write alignment, max payload</text><path d="M22,583.9727 L22,610.9727 A5,5 0 0 0 27,615.9727 L409,615.9727 A5,5 0 0 0 414,610.9727 L414,588.9727 L404,578.9727 L27,578.9727 A5,5 0 0 0 22,583.9727 " fill="#FFF8E6" style="stroke: #E8C66A; stroke-width: 1.0;"/><path d="M404,578.9727 L404,586.4727 A2.5,2.5 0 0 0 406.5,588.9727 L414,588.9727 L404,578.9727 " fill="#FFF8E6" style="stroke: #E8C66A; stroke-width: 1.0;"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="300" x="63.75" y="595.2285">The host plans every later command with these values:</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="225" x="63.75" y="609.0273">chunk size, erase blocks, address range.</text><!--MD5=[8f3171d93884edc867fd20724641e328]
@startuml bootwire_connect_sequence
skinparam shadowing false
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam defaultFontColor #1F2D3D
skinparam roundCorner 10
skinparam titleBorderThickness 0
skinparam ArrowColor #3D5166
skinparam ArrowFontColor #1F2D3D
skinparam ArrowFontSize 13
skinparam ArrowThickness 1.3

skinparam sequence {
  ParticipantBackgroundColor #1B3A5F
  ParticipantBorderColor #1B3A5F
  ParticipantFontColor #FFFFFF
  ParticipantFontStyle plain
  ParticipantFontSize 13
  ParticipantPadding 8
  LifeLineBorderColor #9DB3CC
  LifeLineBackgroundColor #DCEBFB
  BoxPadding 14
  BoxBorderColor #DFE6EE
  BoxFontColor #1B3A5F
  BoxFontStyle bold
  BoxFontSize 14
  GroupBorderColor #9DB3CC
  GroupBackgroundColor #E4ECF5
  GroupHeaderFontColor #1B3A5F
  GroupHeaderFontStyle bold
  GroupFontColor #5B6B7C
  DividerBackgroundColor #EEF3F9
  DividerBorderColor #C9D4E0
  DividerFontColor #1B3A5F
  DividerFontStyle bold
  ReferenceBackgroundColor #F4F7FB
  ReferenceBorderColor #9DB3CC
  ReferenceHeaderBackgroundColor #E4ECF5
  ReferenceFontColor #5B6B7C
  MessageAlign left
}

skinparam note {
  BackgroundColor #FFF8E6
  BorderColor #E8C66A
  FontColor #1F2D3D
  FontSize 12
}

skinparam activity {
  BackgroundColor #F4F7FB
  BorderColor #1B3A5F
  FontColor #1F2D3D
  FontSize 13
  DiamondBackgroundColor #FFFFFF
  DiamondBorderColor #1B3A5F
  DiamondFontColor #1F2D3D
  DiamondFontSize 12
  StartColor #1B3A5F
  EndColor #1B3A5F
  BarColor #1B3A5F
}

hide footbox
title <size:21><color:#1B3A5F><b>CONNECT</b></color></size>\n<size:13><color:#5B6B7C>start of every session: the target reports its flash layout and clears its reply cache</color></size>
box "Host (PC)" #F4F7FB
  participant "<b>bootwire CLI</b>\n<size:11><color:#C9D7E6>host application</color></size>" as APP #1B3A5F
  participant "<b>BootWireClient</b>\n<size:11><color:#C9D7E6>command layer</color></size>" as HOST #1B3A5F
end box
box "Target (Cortex-M bootloader)" #EEF6F4
  participant "<b>Target protocol</b>\n<size:11><color:#CBE6DF>frame check, reply cache</color></size>" as TP #146C5F
  participant "<b>Bootloader core</b>\n<size:11><color:#CBE6DF>flash driver</color></size>" as BL #146C5F
end box

autonumber "<b>00"
APP -> HOST : connect()
HOST -> TP : CONNECT [SEQ=0x9C, protocol version = 2]
activate TP
TP -> TP : CONNECT always executes,\neven if (SEQ, CMD) equals the cached key
TP -> BL : read device ID and flash layout
BL - -> TP : layout
TP -> TP : cache key = (0x9C, CONNECT)\n(replaces anything from an older session)
TP - -> HOST : [SEQ=0x9C, 0x80, <color:#1E8449><b>OK</b></color>, 23-byte device info]
deactivate TP
HOST -> HOST : unpack DeviceInfo
alt protocol version ≠ 2
  HOST - -> APP : BootWireError: versions differ\n(stop: frames may mean something else)
else same version
  HOST - -> APP : DeviceInfo: app region, erase block,\nwrite alignment, max payload
  note over APP, HOST
    The host plans every later command with these values:
    chunk size, erase blocks, address range.
  end note
end
@enduml

