<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="650px" preserveAspectRatio="none" style="width:1032px;height:650px;" version="1.1" viewBox="0 0 1032 650" width="1032px" zoomAndPan="magnify"><rect id="bootwire-background" x="0" y="0" width="1032" height="650" fill="#FFFFFF"/><defs/><g><rect fill="none" height="49.0967" rx="5" ry="5" style="stroke: none; stroke-width: 1.0;" width="487" x="268.75" y="12"/><text xml:space="preserve" fill="#1B3A5F" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="21" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="101" x="461.75" y="36.6978">CONNECT</text><text xml:space="preserve" fill="#5B6B7C" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="471" x="276.75" y="53.3418">start of every session: the target reports its flash layout and clears its reply cache</text><rect fill="#F4F7FB" height="560.4736" rx="5" ry="5" style="stroke: #DFE6EE; stroke-width: 1.0;" width="405.5" x="20" y="72.0967"/><text xml:space="preserve" fill="#1B3A5F" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="65" x="190.25" y="85.2285">Host (PC)</text><rect fill="#EEF6F4" height="560.4736" rx="5" ry="5" style="stroke: #DFE6EE; stroke-width: 1.0;" width="440.5" x="581" y="72.0967"/><text xml:space="preserve" fill="#1B3A5F" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="204" x="699.25" y="85.2285">Target (Cortex-M bootloader)</text><rect fill="#DCEBFB" height="200.6411" style="stroke: #9DB3CC; stroke-width: 1.0;" width="10" x="656.5" y="194.6904"/><rect fill="#FFFFFF" height="169.29" rx