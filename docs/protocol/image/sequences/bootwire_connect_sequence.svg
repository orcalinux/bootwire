erve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="238" x="691.5" y="348.6279">(replaces anything from an older session)</text><polygon fill="#3D5166" points="369.5,391.3315,359.5,395.3315,369.5,399.3315,365.5,395.3315" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3; stroke-dasharray: 2.0,2.0;" x1="363.5" x2="660.5" y1="395.3315" y2="395.3315"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="375.5" y="390.5767">07</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="110" x="393.5" y="390.5767">[SEQ=0x9C, 0x80,</text><text xml:space="preserve" fill="#1E8449" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="19" x="507.5" y="390.5767">OK</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="119" x="526.5" y="390.5767">, 23-byte device info]</text><line style="stroke: #3D5166; stroke-width: 1.3;" x1="358.5" x2="400.5" y1="424.2803" y2="424.2803"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="400.5" x2="400.5" y1="424.2803" y2="437.2803"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="359.5" x2="400.5" y1="437.2803" y2="437.2803"/><polygon fill="#3D5166" points="369.5,433.2803,359.5,437.2803,369.5,441.2803,365.5,437.2803" style="stroke: #3D5166; stroke-width: 1.0;"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndG