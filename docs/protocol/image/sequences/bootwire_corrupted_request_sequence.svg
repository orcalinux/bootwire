 y2="371.083"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="282.5" y="366.3281">04</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="138" x="300.5" y="366.3281">WRITE [SEQ=0x31, …]</text><text xml:space="preserve" fill="#1E90D6" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="57" x="446.5" y="366.3281">«resend»</text><line style="stroke: #3D5166; stroke-width: 1.3;" x1="615.5" x2="657.5" y1="414.9805" y2="414.9805"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="657.5" x2="657.5" y1="414.9805" y2="427.9805"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="616.5" x2="657.5" y1="427.9805" y2="427.9805"/><polygon fill="#3D5166" points="626.5,423.9805,616.5,427.9805,626.5,431.9805,622.5,427.9805" style="stroke: #3D5166; stroke-width: 1.0;"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="622.5" y="402.7512">05</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="89" x="640.5" y="395.2769">CRC-16 correct</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="220" x="640.5" y="410.2256">(0x31, WRITE) not cached → execute</text><polygon fill="#3D5166" points="860.5,452.9292,870.5,456.9292,860.5,460.9292,864.5,456.9292" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3;" x1="615.5" x2="866.5" y1="456.9292" y2="456.9292"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="622.5" y="452.1743">06</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="120" x="640.5" y="452.1743">program + read back</text><polygon fill="#3D5166" points="626.5,481.8779,616.5,485.8779,626.5,489.8779,622.5,485.8779" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3; stroke-dasharray: 2.0,2.0;" x1="620.5" x2="871.5" y1="485.8779" y2="485.8779"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="632.5" y="481.123">07</text><text xml:space="preserve" fill="#1E8449" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="19" x="650.5" y="481.123">OK</text><polygon fill="#3D5166" points="286.5,510.8267,276.5,514.8267,286.5,518.8267,282.5,514.8267" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3; stroke-dasharray: 2.0,2.0;" x1="280.5" x2="609.5" y1="514.8267" y2="514.8267"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="292.5" y="510.0718">08</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="108" x="310.5" y="510.0718">[SEQ=0x31, 0x91,</text><text xml:space="preserve" fill="#1E8449" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="19" x="422.5" y="510.0718">OK</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="4" x="441.5" y="510.0718">]</text><polygon fill="#3D5166" points="74.5,539.7754,64.5,543.7754,74.5,547.7754,70.5,543.7754" style="stroke: #3D5166; stroke-width: 1.0;"/><line style="stroke: #3D5166; stroke-width: 1.3; stroke-dasharray: 2.0,2.0;" x1="68.5" x2="274.5" y1="543.7754" y2="543.7754"/><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="80.5" y="539.0205">09</text><text xml:space="preserve" fill="#1F2D3D" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="33" x="98.5" y="539.0205">return</text><!--MD5=[f3b00948546c34ddd000c9af8e77d8d4]
@startuml bootwire_corrupted_request_sequence
skinparam shadowing false
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Arial
skinparam defaultFontSize 13
skinparam defaultFontColor #1F2D3D
skinparam roundCorner 10
skinparam titleBorderThickness 0
skinparam ArrowColor #3D5166
skinparam ArrowFontColor #1F2D3D
skinparam ArrowFontSize 13
skinparam ArrowThickness 1.3

skinparam sequence {
  ParticipantBackgroundColor #1B3A5F
  ParticipantBorderColor #1B3A5F
  ParticipantFontColor #FFFFFF
  ParticipantFontStyle plain
  ParticipantFontSize 13
  ParticipantPadding 8
  LifeLineBorderColor #9DB3CC
  LifeLineBackgroundColor #DCEBFB
  BoxPadding 14
  BoxBorderColor #DFE6EE
  BoxFontColor #1B3A5F
  BoxFontStyle bold
  BoxFontSize 14
  GroupBorderColor #9DB3CC
  GroupBackgroundColor #E4ECF5
  GroupHeaderFontColor #1B3A5F
  GroupHeaderFontStyle bold
  GroupFontColor #5B6B7C
  DividerBackgroundColor #EEF3F9
  DividerBorderColor #C9D4E0
  DividerFontColor #1B3A5F
  DividerFontStyle bold
  ReferenceBackgroundColor #F4F7FB
  ReferenceBorderColor #9DB3CC
  ReferenceHeaderBackgroundColor #E4ECF5
  ReferenceFontColor #5B6B7C
  MessageAlign left
}

skinparam note {
  BackgroundColor #FFF8E6
  BorderColor #E8C66A
  FontColor #1F2D3D
  FontSize 12
}

skinparam activity {
  BackgroundColor #F4F7FB
  BorderColor #1B3A5F
  FontColor #1F2D3D
  FontSize 13
  DiamondBackgroundColor #FFFFFF
  DiamondBorderColor #1B3A5F
  DiamondFontColor #1F2D3D
  DiamondFontSize 12
  StartColor #1B3A5F
  EndColor #1B3A5F
  BarColor #1B3A5F
}

hide footbox
title <size:21><color:#1B3A5F><b>Fault: Request Damaged</b></color></size>\n<size:13><color:#5B6B7C>the target drops a frame with a bad CRC-16 and stays silent; the host resends after its timeout</color></size>
box "Host (PC)" #F4F7FB
  participant "<b>bootwire CLI</b>\n<size:11><color:#C9D7E6>host application</color></size>" as APP #1B3A5F
  participant "<b>BootWireClient</b>\n<size:11><color:#C9D7E6>command layer</color></size>" as HOST #1B3A5F
end box
box "Target (Cortex-M bootloader)" #EEF6F4
  participant "<b>Target protocol</b>\n<size:11><color:#CBE6DF>frame check, reply cache</color></size>" as TP #146C5F
  participant "<b>Bootloader core</b>\n<size:11><color:#CBE6DF>flash driver</color></size>" as BL #146C5F
end box

autonumber "<b>00"
APP -> HOST : write(0x08008100, 256 bytes)
HOST -> TP : WRITE [SEQ=0x31, …]  <color:#C0392B>one bit flipped on the wire</color>
activate TP
TP -> TP : CRC-16 mismatch\n→ drop, send nothing
deactivate TP
note right of TP
  No error response: the damaged byte could be SEQ
  or CMD, so any answer might point at the wrong request.
end note
... timeout (0.5 s) ...
HOST -> TP : WRITE [SEQ=0x31, …]  <color:#1E90D6><b>«resend»</b></color>
activate TP
TP -> TP : CRC-16 correct\n(0x31, WRITE) not cached → execute
TP -> BL : program + read back
BL - -> TP : <color:#1E8449><b>OK</b></color>
TP - -> HOST : [SEQ=0x31, 0x91, <color:#1E8449><b>OK</b></color>]
deactivate TP
HOST - -> APP : return
@enduml

