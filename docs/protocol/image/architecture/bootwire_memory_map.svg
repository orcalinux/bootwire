<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="724" viewBox="0 0 1040 724" role="img"><rect id="bootwire-background" x="0" y="0" width="1040" height="724" fill="#FFFFFF"/>
<title>BootWire flash memory map</title>
<defs></defs>
<rect width="1040" height="724" fill="#FFFFFF"/>
<text x="520.0" y="42.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1B3A5F" xml:space="preserve">Flash Memory Map</text>
<text x="520.0" y="66.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" text-anchor="middle" fill="#5B6B7C" xml:space="preserve">Example: 256 KiB flash, 2 KiB erase blocks (the values the simulator reports in CONNECT)</text>
<rect x="300.0" y="112.0" width="230.0" height="344.0" rx="0" fill="#DCEBFB" stroke="none" stroke-width="1.0"/>
<line x1="301.0" y1="136.0" x2="529.0" y2="136.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="160.0" x2="529.0" y2="160.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="184.0" x2="529.0" y2="184.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="208.0" x2="529.0" y2="208.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="232.0" x2="529.0" y2="232.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="256.0" x2="529.0" y2="256.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="280.0" x2="529.0" y2="280.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="304.0" x2="529.0" y2="304.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="328.0" x2="529.0" y2="328.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="352.0" x2="529.0" y2="352.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="376.0" x2="529.0" y2="376.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="400.0" x2="529.0" y2="400.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="424.0" x2="529.0" y2="424.0" stroke="#C2D8F0" stroke-width="1"/>
<line x1="301.0" y1="448.0" x2="529.0" y2="448.0" stroke="#C2D8F0" stroke-width="1"/>
<rect x="334.0" y="232.0" width="162.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#9CC0E6" stroke-width="1"/>
<text x="415.0" y="258.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#173E6B" xml:space="preserve">application</text>
<text x="415.0" y="277.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" text-anchor="middle" fill="#5B6B7C" xml:space="preserve">code and data</text>
<rect x="344.0" y="308.0" width="142.0" height="24.0" rx="12" fill="#FFFFFF" stroke="#9CC0E6" stroke-width="1"/>
<text x="415.0" y="324.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12" text-anchor="middle" fill="#173E6B" xml:space="preserve">224 KiB · 112 blocks</text>
<rect x="300.0" y="456.0" width="230.0" height="56.0" rx="0" fill="#2F6DB5" stroke="none" stroke-width="1.0"/>
<text x="415.0" y="480.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">vector table</text>
<text x="415.0" y="499.0" font-family="'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" text-anchor="middle" fill="#DCEBFB" xml:space="preserve">[0] initial SP  [4] reset | 1</text>
<rect x="300.0" y="512.0" width="230.0" height="84.0" rx="0" fill="#1B3A5F" stroke="none" stroke-width="1.0"/>
<text x="415.0" y="549.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF" xml:space="preserve">bootloader</text>
<text x="415.0" y="569.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12" text-anchor="middle" fill="#AFC6E0" xml:space="preserve">32 KiB · runs first after reset</text>
<rect x="300.0" y="112.0" width="230.0" height="484.0" rx="0" fill="none" stroke="#1B3A5F" stroke-width="1.6"/>
<line x1="286.0" y1="112.0" x2="300.0" y2="112.0" stroke="#1B3A5F" stroke-width="1.4"/>
<text x="278.0" y="117.0" font-family="'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="bold" text-anchor="end" fill="#1B3A5F" xml:space="preserve">0x0804_0000</text>
<text x="278.0" y="134.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="11.5" text-anchor="end" fill="#5B6B7C" xml:space="preserve">end of flash = app_start + app_size</text>
<line x1="286.0" y1="512.0" x2="300.0" y2="512.0" stroke="#1B3A5F" stroke-width="1.4"/>
<text x="278.0" y="517.0" font-family="'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="bold" text-anchor="end" fill="#1B3A5F" xml:space="preserve">0x0800_8000</text>
<text x="278.0" y="534.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="11.5" text-anchor="end" fill="#5B6B7C" xml:space="preserve">app_start</text>
<line x1="286.0" y1="596.0" x2="300.0" y2="596.0" stroke="#1B3A5F" stroke-width="1.4"/>
<text x="278.0" y="601.0" font-family="'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="bold" text-anchor="end" fill="#1B3A5F" xml:space="preserve">0x0800_0000</text>
<text x="278.0" y="618.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="11.5" text-anchor="end" fill="#5B6B7C" xml:space="preserve">flash start</text>
<path d="M62,115 L52,115 L52,509 L62,509" fill="none" stroke="#2F6DB5" stroke-width="2" stroke-linejoin="round"/>
<text x="70.0" y="309.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" fill="#2F6DB5" xml:space="preserve">BootWire may change</text>
<text x="70.0" y="326.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="11.5" fill="#5B6B7C" xml:space="preserve">ERASE · WRITE · VERIFY</text>
<path d="M62,515 L52,515 L52,593 L62,593" fill="none" stroke="#1B3A5F" stroke-width="2" stroke-linejoin="round"/>
<text x="70.0" y="551.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="13" font-weight="bold" fill="#1B3A5F" xml:space="preserve">protected</text>
<text x="70.0" y="568.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="11.5" fill="#5B6B7C" xml:space="preserve">BAD_PARAM</text>
<circle cx="530.0" cy="264.0" r="4.5" fill="#2F6DB5" stroke="#FFFFFF" stroke-width="1.5"/>
<path d="M535,264.0 L560,264.0 L560,215.0 L596,215.0" fill="none" stroke="#2F6DB5" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3"/>
<text x="606.0" y="220.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="14.5" font-weight="bold" fill="#2F6DB5" xml:space="preserve">Application region</text>
<text x="606.0" y="239.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">app_start … app_start + app_size (end excluded).</text>
<text x="606.0" y="256.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">ERASE, WRITE and VERIFY are accepted only here,</text>
<text x="606.0" y="273.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">aligned to erase_block (ERASE) or write_align (WRITE).</text>
<text x="606.0" y="290.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">Anything outside gets BAD_PARAM.</text>
<circle cx="530.0" cy="484.0" r="4.5" fill="#2F6DB5" stroke="#FFFFFF" stroke-width="1.5"/>
<path d="M535,484.0 L560,484.0 L560,387 L596,387" fill="none" stroke="#2F6DB5" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3"/>
<text x="606.0" y="392.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="14.5" font-weight="bold" fill="#2F6DB5" xml:space="preserve">Image check before RUN</text>
<text x="606.0" y="411.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">Initial SP inside RAM, reset handler inside the region</text>
<text x="606.0" y="428.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">with the Thumb bit set; otherwise RUN answers NO_APP.</text>
<text x="606.0" y="445.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">Then VTOR = app_start, set MSP, jump to reset.</text>
<circle cx="530.0" cy="554.0" r="4.5" fill="#1B3A5F" stroke="#FFFFFF" stroke-width="1.5"/>
<path d="M535,554.0 L560,554.0 L560,545 L596,545" fill="none" stroke="#1B3A5F" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3"/>
<text x="606.0" y="550.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="14.5" font-weight="bold" fill="#1B3A5F" xml:space="preserve">Bootloader (protected)</text>
<text x="606.0" y="569.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">Never erased or written through BootWire:</text>
<text x="606.0" y="586.0" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">every address here gets BAD_PARAM.</text>
<rect x="40.0" y="644.0" width="960.0" height="59.2" rx="10" fill="#F4F7FB" stroke="#DFE6EE" stroke-width="1"/>
<rect x="40.0" y="644.0" width="5.0" height="59.2" rx="2" fill="#1E90D6" stroke="none" stroke-width="1.0"/>
<text x="60.0" y="668.6" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" font-weight="bold" fill="#1F2D3D" xml:space="preserve">Link the application for app_start </text>
<text x="260.7" y="668.6" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#1F2D3D" xml:space="preserve">(not 0x0800_0000) and keep its vector table at the start of the image.</text>
<text x="60.0" y="687.4" font-family="Arial, Helvetica, 'Liberation Sans', Arimo, sans-serif" font-size="12.5" fill="#5B6B7C" xml:space="preserve">The real values come from your MCU: the target reports them in CONNECT, so the host never hard-codes them.</text>
</svg>
