name: Desktop tests
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m pytest -q
      - name: Native Windows window-management checks
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q tests/gui/test_windowing.py
      - run: python -m pip wheel --no-deps . -w dist
