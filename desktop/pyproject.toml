[project]
name = "bootwire"
version = "0.2.0"
description = "Host-side library and CLI for the BootWire Protocol bootloader"
readme = "README.md"
authors = [
  { name = "Mahmoud Abdelraouf" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "pyserial>=3.5",
  "typer>=0.9",
  "rich>=13.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
gui = [
    "PySide6>=6.8,<7; python_version >= '3.12'",
    # PySide6 6.12.0 drops a reference to True on every Signal.emit() under
    # Python 3.10/3.11 and aborts the interpreter after about a thousand signals.
    "PySide6>=6.8,<7,!=6.12.0; python_version < '3.12'",
    "pyte>=0.8.2,<0.9",
    "ptyprocess>=0.7,<0.8; sys_platform != 'win32'",
    "pywinpty>=2.0.13,<4; sys_platform == 'win32'",
]

[project.scripts]
bootwire = "bootwire_cli.main:app"
bootwire-gui = "bootwire_gui.main:main"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bootwire", "bootwire.*", "bootwire_cli", "bootwire_cli.*", "bootwire_gui", "bootwire_gui.*"]

[tool.setuptools.package-data]
bootwire_gui = ["qml/*.qml", "qml/qmldir", "assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
